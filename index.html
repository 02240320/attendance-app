<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance App</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: #f4f6f9;
    display: flex;
    justify-content: center;
    padding: 10px;
}

.app {
    width: 100%;
    max-width: 420px;
    padding: 20px;
    box-sizing: border-box;
}

h2 {
    text-align: center;
    margin-bottom: 10px;
}

.nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

.nav button {
    padding: 6px 12px;
    border: none;
    background: #4a90e2;
    color: white;
    border-radius: 8px;
    cursor: pointer;
    font-size: 1rem;
}

.calendar {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
}

.day {
    background: white;
    padding: 12px 0;
    text-align: center;
    border-radius: 8px;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    transition: 0.2s;
}

.day:hover {
    background: #e6f0ff;
}

.selected {
    background: #4a90e2;
    color: white;
}

.attendance {
    margin-top: 20px;
    background: white;
    padding: 15px;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

.module {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    margin-bottom: 10px;
    gap: 6px;
}

.module input {
    flex: 1;
    padding: 6px;
    border-radius: 6px;
    border: 1px solid #ccc;
}

.module button {
    border: none;
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.9rem;
}

.present {
    background: #28a745;
    color: white;
}

.absent {
    background: #dc3545;
    color: white;
}

#modules button.add-slot {
    width: 100%;
    margin-top: 6px;
}

@media (max-width: 360px) {
    .nav button, .module button, .module input {
        font-size: 0.85rem;
        padding: 5px;
    }
}
</style>
</head>

<body>
<div class="app">
<h2 id="monthYear"></h2>

<div class="nav">
<button onclick="prevMonth()">◀</button>
<button onclick="nextMonth()">▶</button>
</div>

<div class="calendar" id="calendar"></div>

<div id="attendanceSection" class="attendance" style="display:none;">
<h3 id="selectedDate"></h3>
<div id="modules"></div>
</div>

</div>

<script>
/* Firebase Setup */
const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    databaseURL: "https://YOUR_PROJECT.firebaseio.com",
    projectId: "YOUR_PROJECT",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* Calendar & Attendance Logic */
let today = new Date();
let year = today.getFullYear();
let month = today.getMonth();

const calendarDiv = document.getElementById("calendar");
const monthYear = document.getElementById("monthYear");
const attendanceSection = document.getElementById("attendanceSection");
const selectedDateText = document.getElementById("selectedDate");
const modulesDiv = document.getElementById("modules");

function loadCalendar(){
    calendarDiv.innerHTML="";
    monthYear.innerText = new Date(year,month).toLocaleString('default',{month:'long',year:'numeric'});

    let firstDay = new Date(year,month,1).getDay();
    let daysInMonth = new Date(year,month+1,0).getDate();

    for(let i=0;i<firstDay;i++) calendarDiv.innerHTML+="<div></div>";

    for(let day=1; day<=daysInMonth; day++){
        let div = document.createElement("div");
        div.className="day";
        div.innerText = day;
        div.onclick = div.ontouchstart = () => openDay(day);
        calendarDiv.appendChild(div);
    }
}

function openDay(day){
    let date = new Date(year, month, day);
    let weekday = date.toLocaleString('default',{weekday:'short'});
    let dateKey = `${year}-${month+1}-${day}`;
    let weekKey = `week-${weekday}`;

    selectedDateText.innerText = dateKey+" ("+weekday+")";
    attendanceSection.style.display="block";

    // Load weekly modules
    db.ref(weekKey).get().then(snapshot=>{
        let weekly = snapshot.exists() ? snapshot.val() : Array.from({length:5},(_,i)=>({name:`Module ${i+1}`}));

        // Load attendance for that day
        db.ref(`attendance/${dateKey}`).get().then(snapshot=>{
            let attendance = snapshot.exists() ? snapshot.val() : {};

            modulesDiv.innerHTML = "";

            weekly.forEach((module,index)=>{
                let div = document.createElement("div");
                div.className="module";

                let input = document.createElement("input");
                input.value = module.name;

                let pBtn = document.createElement("button");
                pBtn.innerText="P";

                let aBtn = document.createElement("button");
                aBtn.innerText="A";

                if(attendance[index]==="P") pBtn.classList.add("present");
                if(attendance[index]==="Abs") aBtn.classList.add("absent");

                const markAttendance = (status)=>{
                    attendance[index] = status;
                    module.name = input.value;
                    db.ref(`attendance/${dateKey}`).set(attendance);
                    db.ref(weekKey).set(weekly);
                    openDay(day);
                }

                pBtn.onclick = pBtn.ontouchstart = ()=> markAttendance("P");
                aBtn.onclick = aBtn.ontouchstart = ()=> markAttendance("Abs");

                div.appendChild(input);
                div.appendChild(pBtn);
                div.appendChild(aBtn);
                modulesDiv.appendChild(div);
            });

            // Add slot button
            let addBtn = document.createElement("button");
            addBtn.innerText="+ Add Slot";
            addBtn.className="add-slot";
            addBtn.onclick = addBtn.ontouchstart = ()=>{
                weekly.push({name:"New Module"});
                db.ref(weekKey).set(weekly);
                openDay(day);
            };
            modulesDiv.appendChild(addBtn);
        });
    });
}

function prevMonth(){
    month--;
    if(month<0){ month=11; year--; }
    loadCalendar();
}

function nextMonth(){
    month++;
    if(month>11){ month=0; year++; }
    loadCalendar();
}

loadCalendar();
</script>
</body>
</html>
